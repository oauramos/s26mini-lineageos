    <text x="80" y="118" fill="url(#accent)" font-size="22" font-weight="700" letter-spacing="4">"S26 ULTRA MINI" FALSO · MT6739</text>
    <text x="78" y="196" fill="#ffffff" font-size="68" font-weight="800">S26 Mini · LineageOS</text>
    <text x="80" y="250" fill="#c9d6e3" font-size="28">Tire o backdoor de fábrica. Um programa, poucos cliques.</text>
    <g font-size="20" font-weight="600">
