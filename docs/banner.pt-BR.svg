      <path d="M-22 0 L-6 16 L24 -16" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="30" y="252" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
