      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#10333a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd6b5"/>
      <stop offset="1" stop-color="#6ee7ff"/>
