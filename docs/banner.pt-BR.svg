    <rect x="10" y="12" width="150" height="280" rx="18" fill="url(#screen)"/>
    <path d="M65 12 H105 V28 C105 33 101 36 96 36 H74 C69 36 65 33 65 28 Z" fill="#05090f"/>
    <circle cx="85" cy="23" r="7" fill="#0d1a26" stroke="#27405a" stroke-width="2"/>
