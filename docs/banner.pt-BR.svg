      <text x="154" y="319" fill="#e6f2f7" text-anchor="middle">Android 14</text>
      <rect x="240" y="292" width="222" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="351" y="319" fill="#e6f2f7" text-anchor="middle">Patch 2026-09-01</text>
      <rect x="474" y="292" width="284" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="616" y="319" fill="#e6f2f7" text-anchor="middle">macOS · Windows · Linux</text>
    </g>
